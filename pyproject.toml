[project]
name = "tobench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "torch",
]

[project.optional-dependencies]
iree = ["iree-turbine>=3.9,<4"]
tvm = ["apache-tvm>=0.26,<0.27"]
tvm-tuning = ["apache-tvm>=0.26,<0.27", "xgboost", "psutil", "cloudpickle"]
tensorrt = [
    "torch-tensorrt==2.14.0+cu130",
    "tensorrt-cu13==11.1.0.106",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch-tensorrt = { index = "pytorch-cu130" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
include = ["src/**/*.py"]

[tool.ruff.lint]
select = ["ANN", "I"]

# too strict/noisy for projects
ignore = [
    "ANN401",  # Allow typing.Any
]
